<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Reimbly">
  <defs>
    <linearGradient id="rbMain" x1="96" y1="416" x2="416" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C0A6"/>
      <stop offset=".34" stop-color="#F7C948"/>
      <stop offset=".64" stop-color="#FB7A1E"/>
      <stop offset="1" stop-color="#F5327F"/>
    </linearGradient>
    <linearGradient id="rbCard" x1="120" y1="400" x2="300" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0FB39B"/>
      <stop offset="1" stop-color="#42D9C2"/>
    </linearGradient>
  </defs>

  <!-- back card, peeking out on the left -->
  <rect x="96" y="150" width="210" height="286" rx="46" transform="rotate(-9 201 293)" fill="url(#rbCard)"/>
  <!-- main gradient body -->
  <rect x="150" y="76" width="300" height="360" rx="72" fill="url(#rbMain)"/>

  <!-- white R + up-arrow -->
  <g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M250 386 V 214"/>
    <!-- bowl (top-right loop of the R) -->
    <path d="M250 214 h44 a58 58 0 0 1 0 116 h-44"/>
    <!-- leg -->
    <path d="M262 320 L 348 404" stroke-width="42"/>
  </g>
  <!-- up-arrow head at the top of the stem -->
  <path d="M250 150 l 40 52 h-80 z" fill="#fff"/>
</svg>
