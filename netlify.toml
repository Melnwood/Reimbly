[build]
  publish = "public"
  functions = "netlify/functions"

# Friendly /api/* URLs that map to the serverless functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The "gentle nudge" push about expenses nearing the reimbursement deadline.
# Runs daily and only nudges on the milestone days (10/5/2/1 days left, due day,
# then weekly if overdue), so it never nags. Cron is UTC; "0 15 * * *" = 15:00
# UTC daily. Change the time here, or comment out to turn the push off. The
# deadline itself is set on the Rules screen.
[functions."reminders"]
  schedule = "0 15 * * *"
